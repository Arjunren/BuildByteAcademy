<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildByte Academy Portal</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{primary:'#0EA5E9',primaryHover:'#0284C7',textMain:'#111827',textMuted:'#6B7280'}}}}</script></head>
<body class="bg-slate-50 text-textMain"><main class="min-h-screen max-w-6xl mx-auto px-5 py-10"><a href="index.html" class="font-bold text-xl">◈ BuildByte Academy</a><div id="app" class="mt-10"></div></main><script src="assets/app.js"></script><script>
const app=document.querySelector('#app'), esc=BuildByte.escape;
function form(mode='login'){app.innerHTML=`<section class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-sm border"><h1 class="text-3xl font-bold">${mode==='login'?'Welcome back':'Create your student account'}</h1><p class="text-textMuted mt-2">${mode==='login'?'Sign in to continue learning.':'Teacher and administrator accounts are created by an administrator.'}</p><form id="auth" class="space-y-4 mt-7">${mode==='register'?'<input name="full_name" required placeholder="Full name" class="w-full border p-3 rounded-xl"><select name="gender" required class="w-full border p-3 rounded-xl"><option value="">Gender</option><option>Male</option><option>Female</option><option>Prefer not to say</option><option>Other</option></select>':''}<input name="email" type="email" required placeholder="Email" class="w-full border p-3 rounded-xl"><input name="password" type="password" required placeholder="Password" class="w-full border p-3 rounded-xl">${mode==='register'?'<p class="text-xs text-textMuted">At least 12 characters with upper-case, lower-case, and a number.</p>':''}<button class="w-full bg-primary text-white font-semibold py-3 rounded-xl">${mode==='login'?'Sign in':'Register'}</button></form><button id="switch" class="text-primary mt-5">${mode==='login'?'Need an account? Register':'Already registered? Sign in'}</button><p id="notice" class="text-sm mt-4"></p></section>`;document.querySelector('#switch').onclick=()=>form(mode==='login'?'register':'login');document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{const r=await BuildByte.request('/auth/'+(mode==='login'?'login':'register'),{method:'POST',body:JSON.stringify(d)});if(mode==='login'){localStorage.setItem('buildbyte_token',r.data.access_token);dashboard()}else{verify(d.email)} }catch(x){notice(x.message)}}}
function notice(message){document.querySelector('#notice').textContent=message}
function verify(email){app.innerHTML=`<section class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-sm border"><h1 class="text-3xl font-bold">Verify your email</h1><p class="text-textMuted mt-2">Enter the six-digit code sent to ${esc(email)}.</p><form id="otp" class="space-y-4 mt-7"><input name="code" inputmode="numeric" maxlength="6" required placeholder="000000" class="w-full border p-3 rounded-xl"><button class="w-full bg-primary text-white font-semibold py-3 rounded-xl">Verify account</button></form><p id="notice" class="text-sm mt-4"></p></section>`;document.querySelector('#otp').onsubmit=async e=>{e.preventDefault();try{await BuildByte.request('/auth/verify-otp',{method:'POST',body:JSON.stringify({email,code:new FormData(e.target).get('code')})});form()}catch(x){notice(x.message)}}}
async function dashboard(){try{const r=await BuildByte.request('/auth/me'), u=r.data;if(u.role==='student')return student();return staff(u)}catch(_){form()}}
async function student(){const r=await BuildByte.request('/student/dashboard'), d=r.data;app.innerHTML=`<header class="flex justify-between items-center"><div><p class="text-primary font-semibold">Student dashboard</p><h1 class="text-3xl font-bold">Your learning</h1></div><button class="text-textMuted" onclick="localStorage.removeItem('buildbyte_token');form()">Logout</button></header><div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">${Object.entries(d.statistics).map(([k,v])=>`<div class="bg-white p-5 rounded-2xl border"><b class="text-2xl">${v}</b><p class="capitalize text-textMuted text-sm">${esc(k.replace('_',' '))}</p></div>`).join('')}</div><section class="mt-10"><h2 class="text-xl font-bold mb-4">Active courses</h2><div class="grid md:grid-cols-2 gap-5">${d.courses.map(c=>`<article class="bg-white p-6 rounded-2xl border"><p class="text-primary text-sm font-semibold">${esc(c.category||'Course')}</p><h3 class="font-bold text-xl mt-1">${esc(c.title)}</h3><p class="text-textMuted mt-2">${esc(c.short_description||c.description)}</p><div class="mt-5 h-2 bg-slate-100 rounded"><div class="bg-primary h-2 rounded" style="width:${c.progress}%"></div></div><p class="text-sm mt-2">${c.progress}% complete · ${esc(c.status)}</p></article>`).join('')||'<p class="text-textMuted">No courses yet. <a class="text-primary" href="course.html">Browse courses</a>.</p>'}</div></section>`}
function staff(u){app.innerHTML=`<section class="bg-white p-8 rounded-3xl border"><p class="text-primary font-semibold uppercase">${esc(u.role)} portal</p><h1 class="text-3xl font-bold mt-1">Hello, ${esc(u.full_name)}</h1><p class="text-textMuted mt-3">Your API role is authenticated. The course builder endpoints are ready for the staff interface.</p></section>`}
location.hash==='#register'?form('register'):dashboard();
</script></body></html>
